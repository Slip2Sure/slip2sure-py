[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slip2sure"
# Read from slip2sure/_version.py so the version cannot drift from the
# package, which it previously did (package 1.1.0 vs metadata 1.3.5).
dynamic = ["version"]
description = "SDK for the Slip2Sure slip verification API (Thai bank slips and TrueMoney Wallet)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Slip2Sure Team", email = "dev@slip2sure.com" }]
keywords = [
    "slip2sure",
    "slip",
    "slipverify",
    "slipverification",
    "slip-verification",
    "promptpay",
    "truemoney",
    "bank-slip",
    "thailand",
    "api",
    "sdk",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Lower bounds are the versions this SDK is developed against; upper bounds
# stop a future major release from breaking installs.
dependencies = [
    "pydantic>=2.10.6,<3",
    "aiohttp>=3.11.12,<4",
]

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://slip2sure.com"
Repository = "https://github.com/Slip2Sure/slip2sure-py"
Issues = "https://github.com/Slip2Sure/slip2sure-py/issues"
Documentation = "https://app.slip2sure.com/user/api/docs"

[tool.setuptools]
# Listed explicitly rather than auto-discovered: `tests` is a package (it has
# an __init__.py for its relative imports) and must not be installed as a
# top-level `tests` module in the user's environment.
packages = ["slip2sure", "slip2sure.model"]

[tool.setuptools.dynamic]
version = { attr = "slip2sure._version.VERSION" }

[tool.setuptools.package-data]
# Ships the PEP 561 marker so type checkers use the SDK's annotations.
slip2sure = ["py.typed"]
